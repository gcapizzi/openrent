<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin=""/>
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-8 col-md-push-4">
                    <div id="map"></div>
                </div>
                <div id="search" class="col-md-4 col-md-pull-8">
                    <h1>OpenRent</h1>
                    <form enctype="multipart/form-data" method="post" name="kml-file" id="kml-file" class="pure-form">
                        <div class="form-group">
                            <label for="file">KML file</label>
                            <input type="file" name="file" required />
                        </div>
                        <button type="submit" class="btn btn-default">Load</button>
                    </form>
                    <form name="filters" id="filters">
                        <h2>Rent</h2>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="rent-min">min:</label>
                                    <input type="number" class="form-control" name="rent-min" id="rent-min" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="rent-max">max:</label>
                                    <input type="number" class="form-control" name="rent-max" id="rent-max" />
                                </div>
                            </div>
                        </div>
                        <h2>Bedrooms</h2>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="bedrooms-min">min:</label>
                                    <input type="number" class="form-control" name="bedrooms-min" id="bedrooms-min" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="bedrooms-max">max:</label>
                                    <input type="number" class="form-control" name="bedrooms-max" id="bedrooms-max" />
                                </div>
                            </div>
                        </div>
                        <div class="checkbox">
                            <label for="studio">
                                <input type="checkbox" value="studio" id="studio" /> Studio
                            </label>
                        </div>
                        <div class="checkbox">
                            <label for="shared">
                                <input type="checkbox" value="shared" id="shared" /> Shared
                            </label>
                        </div>
                        <button type="submit" class="btn btn-default">Filter</button>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
        <script src="/script.js"></script>
    </body>
</html>
