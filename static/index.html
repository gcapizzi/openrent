<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin=""/>
        <link rel="stylesheet" href="/style.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-8 order-last">
                    <div id="map"></div>
                    <div id="results">
                        <h2><span id="count">0</span> properties</h2>
                        <template>
                            <div class="result card mb-3">
                                <div class="card-body">
                                    <h5 class="card-title"><a class="title"></a></h5>
                                    <p class="body card-text">...</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div id="search" class="col-md-4 order-first">
                    <h1>OpenRent</h1>
                    <form enctype="multipart/form-data" method="post" name="kml-file" id="kml-file" class="pure-form">
                        <div class="mb-3">
                            <label class="form-label" for="file">KML file</label>
                            <input class="form-control" type="file" name="file" required />
                        </div>
                        <button type="submit" class="btn btn-primary mb-3">Load</button>
                    </form>
                    <form name="filters" id="filters">
                        <h2>Rent</h2>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="rent-min">min:</label>
                                <input type="number" class="form-control" name="rent-min" id="rent-min" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="rent-max">max:</label>
                                <input type="number" class="form-control" name="rent-max" id="rent-max" />
                            </div>
                        </div>
                        <h2>Bedrooms</h2>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="bedrooms-min">min:</label>
                                <input type="number" class="form-control" name="bedrooms-min" id="bedrooms-min" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="bedrooms-max">max:</label>
                                <input type="number" class="form-control" name="bedrooms-max" id="bedrooms-max" />
                            </div>
                        </div>
                        <div class="checkbox">
                            <label class="form-label" for="studio">
                                <input type="checkbox" value="studio" id="studio" /> Studio
                            </label>
                        </div>
                        <div class="checkbox">
                            <label class="form-label" for="shared">
                                <input type="checkbox" value="shared" id="shared" /> Shared
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">Filter</button>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
        <script src="/script.js"></script>
    </body>
</html>
